      - 模块2：技术演进历程与趋势洞察:
          - Agent 技术演进史: 01-theory/02-agent-history.md
      - 模块3：大模型工作原理:
          - Transformer 架构详解: 01-theory/03-transformer.md
          - DeepSeek 系列完整深度笔记: 01-theory/10-deepseek-series.md
          - LLaMA 系列完整深度笔记: 01-theory/11-llama-series.md
